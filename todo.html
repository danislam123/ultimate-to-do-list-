<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ultimate To Do List</title>
<link rel="stylesheet" href="todo.css">
</head>
<body>

<div class="app">

<h1>My To Do List</h1>

<div class="task-input-area">
<input id="taskInput" type="text" placeholder="What do you need to do?">

<select id="categoryInput">
<option value="Study">Study</option>
<option value="Work">Work</option>
<option value="Personal">Personal</option>
<option value="Fitness">Fitness</option>
<option value="Fun">Fun</option>
</select>

<input id="deadlineInput" type="datetime-local">

<button id="addTaskBtn">Add Task</button>
</div>

<div class="stats">

<div class="stat-card">
<h3>Level</h3>
<p id="levelText">Level 1</p>
<div class="xp-container">
<div id="xpBar"></div>
</div>
<p id="xpText">0 / 100 XP</p>
</div>

<div class="stat-card">
<h3>Achievement</h3>
<p id="achievementText">No achievements yet</p>
</div>

</div>

<div class="task-tools">
<p id="taskCount">Tasks: 0</p>
<button id="randomBtn">Random Task</button>
</div>

<ul id="taskList"></ul>

</div>

<script src="todo.js"></script>
</body>
</html>
